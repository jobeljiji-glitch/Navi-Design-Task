<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport: cover for safe-area insets on real iPhone -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- iOS PWA meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- 07c: content runs under the status bar; the stage paints that strip in the demo bar colour -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Group Hold" />

    <!-- Theme colour: the demo stage updates it to the colour at the top of the screen (07c) -->
    <meta name="theme-color" content="#1C1C1C" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/Navi-Design-Task/manifest.webmanifest" />

    <!-- 08: our own icon (ticket + three seats), not the BookMyShow logo -->
    <link rel="icon" type="image/svg+xml" href="/Navi-Design-Task/favicon.svg" />
    <link rel="apple-touch-icon" href="/Navi-Design-Task/apple-touch-icon.png" />
    <meta name="description" content="Group Hold: an interactive prototype of a BookMyShow feature. Hold seats for your group; friends pay their own share." />

    <!-- Roboto from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>Group Hold · BookMyShow prototype</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
